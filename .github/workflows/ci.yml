name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy
      - run: python -m pytest -q
      - run: git diff --check

  xlsx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev,xlsx]"
      - run: python -c "import openpyxl; print(openpyxl.__version__)"
      - run: python -m pytest -q tests/test_hardening_regressions.py -k xlsx
      - run: python -m pytest -q tests/test_followthrough.py -k xlsx

  dependency-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,xlsx]" "biopython==1.83" "setuptools==77.0.3" wheel
      - run: python -m pytest -q
      - run: python -m build --no-isolation

  manifest-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev,xlsx]"
      - run: python -m pytest -q tests/test_manifest_schema.py

  package:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install "build>=1.2,<2"
      - run: python -m build
      - name: Inspect wheel and sdist
        shell: python
        run: |
          import pathlib
          import tarfile
          import zipfile

          dist = pathlib.Path("dist")
          wheels = list(dist.glob("*.whl"))
          sdists = list(dist.glob("*.tar.gz"))
          assert len(wheels) == 1
          assert len(sdists) == 1
          with zipfile.ZipFile(wheels[0]) as archive:
              names = set(archive.namelist())
              assert "enrich_bakta_lib/__main__.py" in names
              assert "merge_engine.py" in names
              assert "normalize_baktfold.py" not in names
          with tarfile.open(sdists[0]) as archive:
              names = archive.getnames()
              assert any(name.endswith("/src/enrich_bakta_lib/core/merge_engine.py") for name in names)
      - name: Install wheel outside checkout
        shell: python
        run: |
          import pathlib
          import subprocess
          import sys
          import tempfile

          wheel = next(pathlib.Path("dist").glob("*.whl"))
          target = pathlib.Path(tempfile.mkdtemp(prefix="enrich-bakta-wheel-"))
          venv = target / "venv"
          subprocess.check_call([sys.executable, "-m", "venv", str(venv)])
          python = venv / ("Scripts/python.exe" if sys.platform == "win32" else "bin/python")
          subprocess.check_call([str(python), "-m", "pip", "install", str(wheel)])
          subprocess.check_call([str(python), "-m", "pip", "check"])
          subprocess.check_call(
              [str(python), "-m", "enrich_bakta_lib", "--version"],
              cwd=target,
          )

  dataset-bytes:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: git lfs pull
      - run: python tools/validate_dataset_manifest.py docs/data/PUBLISHED-MANIFEST.json

  scientific-reruns:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: dataset-bytes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: git lfs pull
      - run: python -m pip install -e ".[dev,xlsx]"
      - run: python tools/run_followthrough_real_checks.py
      - run: python tools/run_followthrough_chain_checks.py
      - run: python tools/run_interproscan_real_checks.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: followthrough-scientific-results
          path: |
            .test-output/followthrough/real-checks.json
            .test-output/followthrough/chain-checks.json
            .test-output/followthrough/*.traceback.txt
          if-no-files-found: ignore
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interproscan-scientific-results
          path: |
            .test-output/interproscan-gates/interproscan-real-checks.json
            .test-output/interproscan-gates/*.traceback.txt
          if-no-files-found: ignore
